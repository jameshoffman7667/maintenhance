name: release

# A release is a push to main that changes the version in backend/package.json
# (frontend/package.json must carry the same number). The job reads X.Y.Z,
# checks the CHANGELOG, builds and pushes the images X.Y.Z, X.Y and latest, and
# creates the GitHub release with `gh release create vX.Y.Z --target $GITHUB_SHA`,
# which also creates the tag. No tag has to be pushed by hand.
#
# Pushing a tag v*.*.* is kept only as a manual fallback. All runs share one
# concurrency group so two runs never work on the same version at once, and a
# run refuses a version whose tag (push to main) or GitHub release (tag push)
# already exists. Tags created by this workflow's own token do not start a
# second run.
#
# Jobs: prepare (detect + validate) -> image (Docker Hub + GitHub release) -> android
# (v2.11, Bubblewrap TWA: builds maintenhance-<version>.apk and uploads it to the release).
# A failed android job leaves the image, release and tag as they are: fix it with a patch release.
on:
  push:
    branches: ["main"]
    paths: ["backend/package.json"]
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
      minor: ${{ steps.detect.outputs.minor }}
      short: ${{ steps.validate.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and decide whether this push is a release
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Manual fallback: tag $GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./backend/package.json').version")"
            PREV=""
            if [ -n "$BEFORE" ] && ! printf %s "$BEFORE" | grep -Eq '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              PREV="$(git show "$BEFORE:backend/package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)"
            fi
            if [ "$PREV" = "$VERSION" ]; then
              echo "backend/package.json version is still $VERSION: not a release, nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Version changed: ${PREV:-<none>} -> $VERSION"
          fi
          printf %s "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version '$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        id: validate
        if: steps.detect.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          # version files agree with each other, and with the tag on the fallback path
          BACK="$(node -p "require('./backend/package.json').version")"
          FRONT="$(node -p "require('./frontend/package.json').version")"
          [ "$FRONT" = "$BACK" ] || { echo "frontend/package.json ($FRONT) != backend/package.json ($BACK)"; exit 1; }
          [ "$BACK" = "$VERSION" ] || { echo "Version file ($BACK) != release version ($VERSION)"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # fallback: the tag is the one being released, so a GitHub release must not exist yet
            if gh release view "v$VERSION" >/dev/null 2>&1; then echo "GitHub release v$VERSION already exists"; exit 1; fi
          else
            # main push: the tag must not exist, locally fetched or on the remote
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists: bump the version before pushing"; exit 1
            fi
            if gh release view "v$VERSION" >/dev/null 2>&1; then echo "GitHub release v$VERSION already exists"; exit 1; fi
          fi
          # changelog must contain this version with Short <= 50 and Long <= 250 chars
          grep -q "^## v$VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$VERSION"; exit 1; }
          SHORT="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Short:\*\*/{sub(/^\*\*Short:\*\* /,"");print;exit}' CHANGELOG.md)"
          LONG="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Long:\*\*/{sub(/^\*\*Long:\*\* /,"");print;exit}' CHANGELOG.md)"
          [ "${#SHORT}" -gt 0 ] && [ "${#SHORT}" -le 50 ] || { echo "Short is ${#SHORT} chars (max 50)"; exit 1; }
          [ "${#LONG}" -gt 0 ] && [ "${#LONG}" -le 250 ] || { echo "Long is ${#LONG} chars (max 250)"; exit 1; }
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"


  image:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mybadreligon/${{ github.event.repository.name }}
          # type=semver only works on tag pushes, so the tags are written out
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT: ${{ needs.prepare.outputs.short }}
        run: |
          set -euo pipefail
          awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^## v/{exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # --target makes gh create the tag vX.Y.Z on this commit (ignored if the tag already exists)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION - $SHORT" --notes-file "$RUNNER_TEMP/notes.md"

  android:
    needs: [prepare, image]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Skips (green, with a notice) until the repo has twa-manifest.json and James has added the
      # four ANDROID_* secrets, so a release never fails only because the key does not exist yet.
      - name: Check the Android build is set up
        id: gate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -f twa-manifest.json ]; then echo "::notice::No twa-manifest.json: Android build skipped"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::notice::Secret ANDROID_$v is not set: Android build skipped"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "build=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.build == 'true'
        with:
          node-version: "20"

      - name: Build and sign the APK
        if: steps.gate.outputs.build == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(node scripts/android-version.js "$VERSION")"
          echo "versionName=$VERSION versionCode=$VERSION_CODE"
          npm install -g @bubblewrap/cli@1
          printf %s "$KEYSTORE_B64" | base64 -d > android.keystore
          # point Bubblewrap at the runner's JDK and Android SDK so it does not ask to download them
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          # Bubblewrap only accepts an SDK folder that has a "tools" or "bin" folder at its root and needs
          # build-tools 36.1.0, so create the folder and install the pieces with the runner's sdkmanager.
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_HOME/tools"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "build-tools;36.1.0" "platforms;android-36" >/dev/null
          node -e '
            const fs=require("fs"); const m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));
            m.appVersion=process.env.VERSION; m.appVersionCode=Number(process.argv[1]); delete m.appVersionName;
            m.signingKey={path:"./android.keystore",alias:process.env.KEY_ALIAS};
            fs.writeFileSync("twa-manifest.json",JSON.stringify(m,null,2));
          ' "$VERSION_CODE"
          # generate the Android project from twa-manifest.json (also writes manifest-checksum.txt) without prompting
          bubblewrap update --skipVersionUpgrade < /dev/null
          # The generated project shrinks the code with R8 (minifyEnabled true), which renames a class the
          # Android package manager looks up by its original name, so the app crashed at start on a real phone
          # ("Component class R.u does not exist"). Turn shrinking off; the APK is only slightly larger.
          sed -i 's/minifyEnabled true/minifyEnabled false/' app/build.gradle
          grep -q 'minifyEnabled false' app/build.gradle
          bubblewrap build --skipPwaValidation < /dev/null
          mv app-release-signed.apk "maintenhance-$VERSION.apk"
          rm -f android.keystore

      - name: Attach the APK to the GitHub release
        if: steps.gate.outputs.build == 'true'
        run: gh release upload "v$VERSION" "maintenhance-$VERSION.apk" --clobber
