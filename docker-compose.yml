services:
  maintenhance:
    # Pulled from Docker Hub — built and published automatically by
    # .github/workflows/release.yml when a version tag is pushed. Replace "mybadreligon"
    # below with your own Docker Hub username if you're publishing
    # under a different account.
    #
    # This is a pure image deploy — there's no `build:` section here,
    # so `docker compose up` (or a Portainer stack from this file
    # alone) never needs the Dockerfile or source tree, just Docker
    # Hub access. To build the image yourself instead of waiting on
    # CI, see "Prebuilding the image" in README.md.
    image: mybadreligon/maintenhance:latest
    container_name: maintenhance
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8040}
      # Time zone used for digest email times (e.g. America/Toronto). Defaults to UTC.
      - TZ=${TZ:-UTC}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your .env file (or in Portainer's stack environment variables) — see .env.example}
      # Leave COOKIE_SECURE unset/false for plain-HTTP local access.
      # Set to "true" once this sits behind HTTPS (e.g. a reverse
      # proxy you run separately) — browsers drop secure cookies sent
      # over plain HTTP.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Optional email digest (overdue work orders, expiring warranties,
      # unreviewed work requests) — leave SMTP_HOST blank to disable.
      # See .env.example for details.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NOTIFY_WARRANTY_WINDOW_DAYS=${NOTIFY_WARRANTY_WINDOW_DAYS:-30}
      - NOTIFY_UNREVIEWED_WINDOW_DAYS=${NOTIFY_UNREVIEWED_WINDOW_DAYS:-3}
      # Public address people use to reach the app (no trailing slash), e.g.
      # https://maint.example.com. Needed for the emailed password-reset
      # link; with SMTP_HOST also set, "Forgot password?" appears on the
      # sign-in screen.
      - APP_URL=${APP_URL:-}
      # Automatic nightly database snapshots in the data volume. Keep the
      # newest BACKUP_KEEP (default 7); set BACKUP_SNAPSHOTS=false to turn off.
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
      - BACKUP_SNAPSHOTS=${BACKUP_SNAPSHOTS:-true}
      - DATA_DIR=/data
      - FILES_DIR=/files
      # Optional: lets the Owner switch on AI-assisted "fill in from a link"
      # (Owner Tools -> Features). Read by the server only, never sent to
      # the browser. Blank = the plain page-details fallback is used.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      # Optional (v2.9): email/text intake. See deploy/RELEASE.md. Blank = off.
      - INBOUND_EMAIL_SECRET=${INBOUND_EMAIL_SECRET:-}
      - INBOUND_EMAIL_ADDRESS=${INBOUND_EMAIL_ADDRESS:-}
      # Name, logo, colours, location labels and feature toggles are set
      # in the app by the Owner (Owner Tools), not here.
    volumes:
      # Fast storage (SSD): the SQLite database. Set DATA_PATH in .env to a
      # host folder to place it on a specific disk; blank = a named volume.
      - ${DATA_PATH:-maintenhance_data}:/data
      # Slow storage (e.g. a disc pool): photos, nightly snapshots and temp
      # import files. Set FILES_PATH in .env to a host folder on the pool;
      # blank = a named volume.
      - ${FILES_PATH:-maintenhance_files}:/files
    ports:
      # Set PORT in your .env (or Portainer's stack environment variables)
      # to change this — both the host and container side move together.
      # Local web portal access: http://<this-machine's-LAN-IP>:${PORT:-8040}
      - "${PORT:-8040}:${PORT:-8040}"

volumes:
  maintenhance_data:
  maintenhance_files:
