<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#28415F" />
<title>Offline - MaintEnhance</title>
<style>
  :root { color-scheme: light dark; --bg: #E5E8E2; --ink: #1c2a22; --card: #fff; --accent: #28415F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151a17; --ink: #e6ebe7; --card: #1f2622; --accent: #8FA9C4; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; background: var(--card); border-radius: 8px; padding: 28px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 18px; line-height: 1.45; }
  a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 22px; background: var(--accent); color: #fff; border-radius: 4px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>MaintEnhance cannot reach the server right now. Check your connection, then try again.</p>
  <a href="./">Try again</a>
</main>
</body>
</html>
